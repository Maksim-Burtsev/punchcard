<text class="l1" x="22" y="86"><tspan class="green">✓</tspan> <tspan class="dim">three finder passes · every value to its last consumer · every removed guarantee</tspan></text>
<text class="l2" x="22" y="106"><tspan class="green">✓</tspan> <tspan class="dim">judging 7 candidates against the constitution · running main and this PR</tspan></text>
<text class="l3" x="22" y="126"></text>
<text class="l4" x="22" y="146"><tspan class="orange b">🟠 Ship after #1.</tspan></text>
<text class="l5" x="22" y="166"></text>
<text class="l6" x="22" y="186">Finding #1 is a regression this PR introduces on malformed Link headers and must be fixed</text>
<text class="l7" x="22" y="206">before merge; #2 and #3 are worth closing in the same change but do not block.</text>
<text class="l8" x="22" y="226"></text>
<text class="l9" x="22" y="246"><tspan class="dim">  #   severity   what                                                                     where</tspan></text>
<text class="l10" x="22" y="266"></text>
<text class="l11" x="22" y="286">  1   <tspan class="red">● BLOCKER</tspan>  One stray &quot; anywhere in the header silently deletes every link after it   utils.py:1004</text>
<text class="l12" x="22" y="306">  2   <tspan class="yellow">● DESIGN</tspan>   The quoted-string scanner now exists twice, so #1 has to be fixed twice   utils.py:973</text>
<text class="l13" x="22" y="326">  3   <tspan class="yellow">● DESIGN</tspan>   The two load-bearing branches of the new splitter have no test            utils.py:1002</text>
<text class="l14" x="22" y="346"></text>
<text class="l15" x="22" y="366"><tspan class="red b">● 1 · One stray &quot; anywhere in the header silently deletes every link after it</tspan></text>
<text class="l16" x="22" y="386"><tspan class="dim">src/requests/utils.py:1004</tspan> · A caller reading r.links[&quot;last&quot;][&quot;url&quot;] gets the first link&#x27;s URL back,</text>
<text class="l17" x="22" y="406">with no exception and nothing that looks wrong.</text>
<text class="l18" x="22" y="426"></text>
<text class="l19" x="22" y="446">  &gt;&gt;&gt; parse_header_links(&#x27;&lt;https://x/a&quot;b&gt;; rel=&quot;next&quot;, &lt;https://x/c&gt;; rel=&quot;last&quot;&#x27;)</text>
<text class="l20" x="22" y="466"><tspan class="dim">  # main</tspan></text>
<text class="l21" x="22" y="486">  [{&#x27;url&#x27;: &#x27;https://x/a&quot;b&#x27;, &#x27;rel&#x27;: &#x27;next&#x27;}, {&#x27;url&#x27;: &#x27;https://x/c&#x27;, &#x27;rel&#x27;: &#x27;last&#x27;}]</text>
<text class="l22" x="22" y="506"><tspan class="dim">  # this PR</tspan></text>
<text class="l23" x="22" y="526">  [{&#x27;url&#x27;: &#x27;https://x/a&quot;b&#x27;, &#x27;rel&#x27;: &#x27;last&#x27;}]</text>
<text class="l24" x="22" y="546"></text>
<text class="l25" x="22" y="566">  🔧 <tspan class="b">Fix: track quote state per entry, and only for quotes outside the &lt;...&gt; target.</tspan></text>
